name: frequent-monitor
on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (KST 02:00부터 매시간). 매시간이라 UTC 오프셋 무관
  workflow_dispatch:

concurrency:
  group: monitor-data      # daily 와 커밋 충돌 방지
  cancel-in-progress: false

permissions:
  contents: write          # data/*.jsonl 커밋

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.run_frequent
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: commit data
        run: |
          git config user.name  "monitor-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --cached --quiet || git commit -m "data: frequent $(date -u +%FT%TZ)"
          git push
