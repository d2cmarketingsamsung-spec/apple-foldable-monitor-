name: daily-monitor
on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = KST 02:00. SERP/뉴스/리포트 메일 하루 1회
  workflow_dispatch:

concurrency:
  group: monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.run_daily
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - name: commit data
        run: |
          git config user.name  "monitor-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --cached --quiet || git commit -m "data: daily $(date -u +%FT%TZ)"
          git push
