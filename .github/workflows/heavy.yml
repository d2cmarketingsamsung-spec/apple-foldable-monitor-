name: heavy-monitor
on:
  schedule:
    - cron: "0 * * * *"   # 매시 정각 (KST 02:00부터 매시간). SERP는 예산 가드로 자동 조절
  workflow_dispatch:

concurrency:
  group: monitor-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m src.run_daily
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - name: commit data
        run: |
          git config user.name  "monitor-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main || true
          git add data/
          git diff --cached --quiet || git commit -m "data: daily $(date -u +%FT%TZ)"
          git push
