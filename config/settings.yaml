# 실행/저장/알림 공통 설정

release_date: "2026-09-09"   # 애플 폴더블 아이폰 발표일

storage:
  # 수집은 data/*.jsonl 에 append. 리포트는 이 파일들을 Excel 워크북으로 묶어 메일 발송.
  local_dir: data

report:
  # heavy 워크플로는 매시간 돌지만 Excel 리포트 메일은 하루 1회만 (지정 UTC 시각의 실행에서).
  # 17 UTC = KST 02:00. 매시간 리포트를 원하면 email_every_run: true.
  email_hour_utc: 17
  email_every_run: false

llm:
  # 무료만 사용. openai(gpt-4o-mini)·anthropic(claude)은 유료라 제외.
  # 나중에 예산 생기면 providers 에 "openai","anthropic" 추가하면 코드 그대로 동작.
  providers: ["gemini"]
  gemini_model: "gemini-3.6-flash"   # 2.5-flash 는 신규 사용자 사용 불가(404)
  openai_model: "gpt-4o-mini"
  anthropic_model: "claude-haiku-4-5-20251001"
  max_tokens: 900
  temperature: 0.3

serp:
  # SerpApi 무료 250회/월. 매시간 실행이면 하루 안에 소진되므로 예산 가드로 자동 중단.
  # (검색 1건 + AI Overview 후속 1건 ≈ 국가당 3~4콜/실행)
  monthly_call_budget: 230
  engine_locale:
    US: {gl: us, hl: en, google_domain: google.com}
    GB: {gl: uk, hl: en, google_domain: google.co.uk}
    IN: {gl: in, hl: en, google_domain: google.co.in}
    KR: {gl: kr, hl: ko, google_domain: google.co.kr}

# 임계치 초과 시 알림 (§7). WoW = 전주 대비 변화율
alerts:
  trends_wow_spike_pct: 40        # 검색량 급증
  trends_wow_drop_pct: -30        # 급감
  llm_samsung_negative_ratio: 0.5 # 삼성 부정 언급 비중
  serp_ai_overview_appeared: true # AI Overview 신규 등장 시
  channel: "email"                # email | slack
